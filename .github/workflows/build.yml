name: Build NRO

# Builds the Switch NRO on every push and PR, then publishes a release
# artifact whenever a `v*` tag is pushed.

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build hl2_nx.nro
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute short SHA
        run: |
          echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Install portlibs
        run: |
          set -euo pipefail

          dkp-pacman -Syu --noconfirm

          dkp-pacman -S --needed --noconfirm \
            switch-sdl2 \
            switch-sdl2_image \
            switch-mesa \
            switch-zlib \
            switch-ffmpeg \
            switch-bzip2 \
            switch-dav1d \
            switch-libjpeg-turbo \
            switch-libpng \
            switch-libwebp

      - name: Show toolchain versions
        run: |
          echo "DEVKITPRO=${DEVKITPRO:-/opt/devkitpro}"
          echo "DEVKITA64=${DEVKITA64:-/opt/devkitpro/devkitA64}"

          "${DEVKITPRO:-/opt/devkitpro}/devkitA64/bin/aarch64-none-elf-gcc" --version | head -1

          dkp-pacman -Q | grep -E '^(devkitA64|libnx|switch-)' || true

      - name: Build
        run: |
          set -euo pipefail

          make -j"$(nproc)"

          ls -lh \
            hl2_nx.nro \
            hl2_nx.elf \
            hl2_nx.nacp

      - name: Stage artifacts
        run: |
          set -euo pipefail

          mkdir -p artifacts

          cp hl2_nx.nro artifacts/
          cp hl2_nx.nacp artifacts/
          cp hl2_nx.elf artifacts/

          cat > artifacts/README.txt <<EOF
          Half-Life 2 - Nintendo Switch port (aarvsn fork)

          Build: ${SHORT_SHA}
          Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          Install:
            1. Copy hl2_nx.nro to /switch/hl2_nx/ on your SD card.
            2. Follow the install guide:
               https://github.com/aarvsn/hl2-nx#quick-start

          Commit:
          ${GITHUB_SHA}
          EOF

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hl2_nx-${{ env.SHORT_SHA }}
          path: artifacts/*
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Compute short SHA
        run: |
          echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: hl2_nx-${{ env.SHORT_SHA }}
          path: release

      - name: Zip release
        run: |
          set -euo pipefail

          cd release
          zip -r "../hl2_nx-${GITHUB_REF_NAME}.zip" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            hl2_nx-${{ github.ref_name }}.zip
            release/hl2_nx.nro
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
